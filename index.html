<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>km_graph — 2D/3D Graphics Editor</title>
<style>
:root{--bg:#0a0f22;--cd:#141a36;--ln:#28315e;--tx:#e8ecff;--mu:#97a3d4;--a:#6ea8ff;--b:#ff9a56;--g:#3ddc97}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,"Segoe UI",Tahoma,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--ln);background:#0d1330}
.logo{font-weight:800;font-size:20px;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;margin-right:8px}
button,select,input{font:inherit}
button{background:#222b5c;color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:6px 11px;cursor:pointer}
button:hover{border-color:var(--a)}button.on,button.pr{background:linear-gradient(90deg,var(--a),#8b7bff);color:#fff;border-color:transparent}
select,input[type=number],input[type=text]{background:#0c1230;color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:4px 6px}
input[type=number]{width:64px}input[type=color]{width:34px;height:28px;padding:0;border:0;background:none}
.app{display:grid;grid-template-columns:270px 1fr 270px;gap:10px;padding:10px;max-width:1500px;margin:auto}
@media(max-width:1000px){.app{grid-template-columns:1fr}}
.cd{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:10px;margin-bottom:10px}
.cd h4{margin:0 0 6px;color:var(--a);font-size:13px;text-transform:uppercase;letter-spacing:.5px}
.r{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0}
label{color:var(--mu);display:inline-flex;gap:4px;align-items:center}
canvas{width:100%;height:auto;border:1px solid var(--ln);border-radius:12px;background:#0e1430;touch-action:none;display:block}
table{border-collapse:collapse;direction:ltr;font-size:12px}td,th{border:1px solid var(--ln);padding:2px 7px;text-align:center}th{background:#1e2650}
.mx{display:inline-block;border-left:2px solid var(--tx);border-right:2px solid var(--tx);border-radius:5px;padding:0 2px}.mx td{border:0}
#log{max-height:170px;overflow:auto;font-size:12px;color:var(--mu)}#log div{border-bottom:1px solid var(--ln);padding:2px 0}
.hint{color:var(--mu);font-size:12px}
.hid{display:none!important}
footer{text-align:center;padding:18px;color:var(--mu)}footer a{color:var(--b);font-weight:700;text-decoration:none}footer a:hover{text-decoration:underline}
</style>
</head>
<body>
<header>
<span class="logo">km_graph</span>
<button data-m="2" class="on">2D</button><button data-m="3">3D</button><button data-m="i">Image</button>
<span style="flex:1"></span>
<button id="un">↶ Undo</button><button id="re">↷ Redo</button><button id="dl">⬇ PNG</button>
</header>
<div class="app">
<div>
 <div class="cd" data-md="2"><h4>Draw tools</h4>
  <div class="r" id="tools"><button data-t="sel" class="on">Select/Move</button><button data-t="poly">Polygon</button><button data-t="rect">Rect</button><button data-t="circ">Circle</button></div>
  <div class="r"><label>Color <input type="color" id="col" value="#6ea8ff"></label><label><input type="checkbox" id="grid" checked>Grid</label><label><input type="checkbox" id="snap" checked>Snap</label></div>
  <div class="r"><button id="del">Delete</button><button id="clr">Clear</button></div>
  <div class="r"><select id="pre2"><option value="">Lecture examples…</option><option>A(3,4) B(6,4) C(5,6)</option><option>a(2,2) b(8,2) c(5,5)</option><option>A(2,7) B(7,10) C(10,2)</option><option>A(0,0) B(2,2) C(4,2)</option><option>a(2,2) b(10,2) c(5,5)</option></select></div>
  <div class="hint">Polygon: click points, double-click/Enter to close. Shift+click = set custom pivot. Wheel = zoom.</div>
 </div>
 <div class="cd" data-md="3"><h4>3D object</h4>
  <div class="r"><select id="pre3"><option value="cube">Cube</option><option value="pyr">Pyramid</option><option value="tet">Lecture: A(0,3,1) B(3,3,2) C(3,0,0) D(0,0,0)</option><option value="prism">Prism</option></select><label><input type="checkbox" id="per" checked>Perspective</label></div>
  <div class="hint">Drag = orbit, wheel = zoom.</div>
 </div>
 <div class="cd" data-md="23"><h4>Transform</h4>
  <div class="r"><select id="op"></select></div>
  <div class="r"><span id="pa"><label id="la">a<input type="number" id="a" step="any"></label><label id="lb">b<input type="number" id="b" step="any"></label><label id="lc">c<input type="number" id="c" step="any"></label></span><select id="rf"></select></div>
  <div class="r"><label>Pivot <select id="pv"><option value="o">Origin</option><option value="c">Object center</option><option value="p">Custom</option></select></label></div>
  <div class="r"><label>x<input type="number" id="pxv" value="0" step="any"></label><label>y<input type="number" id="pyv" value="0" step="any"></label><label id="lz">z<input type="number" id="pzv" value="0" step="any"></label></div>
  <div class="r"><button class="pr" id="ap">Apply</button><span class="hint">Applies to selected shape (or all)</span></div>
 </div>
 <div class="cd" data-md="i"><h4>Image lab</h4>
  <div class="r"><input type="file" id="fl" accept="image/*"></div>
  <div class="r"><label>Sampling <select id="iN"><option>8<option>16<option>32<option>64<option selected>128<option>256</select></label></div>
  <div class="r"><label>Bits <input type="range" id="iq" min="1" max="8" value="8"><b id="iqv">8</b></label></div>
  <div class="r"><label><input type="checkbox" id="ig">Gray</label><label><input type="checkbox" id="ifx">Flip X</label><label><input type="checkbox" id="ify">Flip Y</label></div>
  <div class="r"><label>Rotate° <input type="number" id="ir" value="0"></label><label>Scale <input type="number" id="is" value="1" step="0.1"></label></div>
  <label><input type="checkbox" id="ism">Smooth display</label>
 </div>
</div>
<div>
 <canvas id="cv" width="900" height="600"></canvas>
 <canvas id="ci" width="600" height="600" class="hid"></canvas>
 <div class="hint" id="st" style="margin-top:4px">&nbsp;</div>
</div>
<div>
 <div class="cd" data-md="23"><h4>Transformation matrix</h4><div id="mat"></div></div>
 <div class="cd" data-md="23"><h4>Vertices</h4><div id="tbl"></div></div>
 <div class="cd" data-md="23"><h4>History log</h4><div id="log"></div></div>
</div>
</div>
<footer>devolved by <a href="https://kareem-mohamed-rust.vercel.app/" target="_blank" rel="noopener">Kareem Mohamed</a></footer>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],N=i=>+$('#'+i).value||0;
const I=n=>[...Array(n)].map((_,i)=>[...Array(n)].map((_,j)=>+(i==j)));
const mul=(A,B)=>A.map((r,i)=>B[0].map((_,j)=>r.reduce((s,_,k)=>s+A[i][k]*B[k][j],0)));
const rd=x=>{x=Math.round(x*1e6)/1e6;return x===0?0:x},f2=x=>Math.round(x*100)/100||0;
const ap=(M,q)=>{const n=M.length-1,v=[...q,1];return M.slice(0,n).map(r=>rd(r.reduce((s,x,k)=>s+x*v[k],0)))};
let mode=2,tool='sel',sh=[],sel=-1,tmp=[],ghost=[],H=[],Rd=[],drag=null,ms=[0,0],S=24,S3=44,yaw=.6,pit=.45,o3={v:[],e:[]},g3=null,LOG=[];
const cv=$('#cv'),g=cv.getContext('2d'),W=900,HT=600;
const X=x=>W/2+x*S,Y=y=>HT/2-y*S,wx=p=>(p-W/2)/S,wy=p=>(HT/2-p)/S;
const L=(a,b,c,d)=>{g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.stroke()};
const sn=x=>$('#snap').checked?Math.round(x):Math.round(x*100)/100;
const snap=()=>{H.push(JSON.stringify({sh,o3,sel}));Rd=[]};
const rest=s=>{const o=JSON.parse(s);sh=o.sh;o3=o.o3;sel=o.sel;ghost=[];g3=null;all()};
$('#un').onclick=()=>{if(!H.length)return;Rd.push(JSON.stringify({sh,o3,sel}));rest(H.pop())};
$('#re').onclick=()=>{if(!Rd.length)return;H.push(JSON.stringify({sh,o3,sel}));rest(Rd.pop())};
/* ---- transform UI ---- */
const OP={2:{t:['Translate',['tx','ty'],[3,4]],s:['Scale',['sx','sy'],[2,2]],r:['Rotate',['θ°'],[90]],f:['Reflect',[],[]],h:['Shear',['shx','shy'],[1,0]]},3:{t:['Translate',['tx','ty','tz'],[2,1,2]],s:['Scale',['sx','sy','sz'],[2,2,2]],rx:['Rotate X',['θ°'],[90]],ry:['Rotate Y',['θ°'],[90]],rz:['Rotate Z',['θ°'],[90]],f:['Reflect',[],[]]}};
const RF={2:{x:'about X-axis',y:'about Y-axis',o:'about Origin',d:'about y = x',n:'about y = −x'},3:{xy:'XY plane',yz:'YZ plane',xz:'XZ plane',o:'Origin'}};
function setOps(){const o=OP[mode];$('#op').innerHTML=Object.keys(o).map(k=>`<option value="${k}">${o[k][0]}</option>`).join('');$('#rf').innerHTML=Object.keys(RF[mode]).map(k=>`<option value="${k}">${RF[mode][k]}</option>`).join('');$('#lz').classList.toggle('hid',mode==2);opCh()}
function opCh(){const d=OP[mode][$('#op').value];['a','b','c'].forEach((k,i)=>{const l=$('#l'+k);l.classList.toggle('hid',i>=d[1].length);l.firstChild.textContent=d[1][i]||'';$('#'+k).value=d[2][i]??0});$('#rf').classList.toggle('hid',$('#op').value!='f');$('#pa').classList.toggle('hid',$('#op').value=='f');prev()}
const pts=()=>mode==2?(sel>=0?sh[sel].p:sh.flatMap(s=>s.p)):o3.v;
function pivot(){const m=mode,k=$('#pv').value;if(k=='o')return Array(m).fill(0);if(k=='p')return[N('pxv'),N('pyv'),N('pzv')].slice(0,m);const P=pts();if(!P.length)return Array(m).fill(0);return[...Array(m)].map((_,i)=>{const c=P.map(q=>q[i]);return(Math.min(...c)+Math.max(...c))/2})}
function build(){const m=mode,op=$('#op').value,v=[N('a'),N('b'),N('c')],rf=$('#rf').value;
 const Tr=w=>{const M=I(w.length+1);w.forEach((x,i)=>M[i][w.length]=x);return M},Sc=w=>{const M=I(w.length+1);w.forEach((x,i)=>M[i][i]=x);return M},em=r=>{const M=I(m+1);r.forEach((row,i)=>row.forEach((x,j)=>M[i][j]=x));return M};
 const a=v[0]*Math.PI/180,c=+Math.cos(a).toFixed(10),s=+Math.sin(a).toFixed(10);let O;
 if(op=='t')return Tr(v.slice(0,m));
 if(op=='s')O=Sc(v.slice(0,m));if(op=='r')O=em([[c,-s],[s,c]]);
 if(op=='rx')O=em([[1,0,0],[0,c,-s],[0,s,c]]);if(op=='ry')O=em([[c,0,s],[0,1,0],[-s,0,c]]);if(op=='rz')O=em([[c,-s,0],[s,c,0],[0,0,1]]);
 if(op=='h')O=em([[1,v[0]],[v[1],1]]);
 if(op=='f')O=m==2?(rf=='d'?em([[0,1],[1,0]]):rf=='n'?em([[0,-1],[-1,0]]):Sc({x:[1,-1],y:[-1,1],o:[-1,-1]}[rf])):Sc({xy:[1,1,-1],yz:[-1,1,1],xz:[1,-1,1],o:[-1,-1,-1]}[rf]);
 const p=pivot();return mul(mul(Tr(p),O),Tr(p.map(x=>-x)))}
const mh=M=>`<span class="mx"><table>${M.map(r=>'<tr>'+r.map(x=>`<td>${f2(x)}</td>`).join('')+'</tr>').join('')}</table></span>`;
function prev(){if(mode==='i')return;$('#mat').innerHTML=mh(build())}
$('#op').onchange=opCh;['a','b','c','rf','pv','pxv','pyv','pzv'].forEach(i=>$('#'+i).oninput=prev);
$('#ap').onclick=()=>{const M=build(),name=$('#op').selectedOptions[0].text;snap();
 if(mode==2){const T=sel>=0?[sel]:sh.map((_,i)=>i);ghost=T.map(i=>JSON.parse(JSON.stringify(sh[i])));T.forEach(i=>sh[i].p=sh[i].p.map(q=>ap(M,q)))}
 else{g3=o3.v.map(q=>q.slice());o3.v=o3.v.map(q=>ap(M,q))}
 LOG.unshift(`<div><b>${name}</b> ${mode==2?'':'3D '}${mh(M)}</div>`);all()};
/* ---- 2D ---- */
const LT='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
function path(p){g.beginPath();p.forEach((q,i)=>i?g.lineTo(X(q[0]),Y(q[1])):g.moveTo(X(q[0]),Y(q[1])));g.closePath()}
function d2(){g.fillStyle='#0e1430';g.fillRect(0,0,W,HT);
 if($('#grid').checked){const nx=Math.ceil(W/2/S),ny=Math.ceil(HT/2/S);g.font='11px sans-serif';for(let k=-nx;k<=nx;k++){g.strokeStyle=k?'#1b2452':'#8d98d6';g.lineWidth=k?1:2;L(X(k),0,X(k),HT);if(k&&k%5==0){g.fillStyle='#7f8cc4';g.fillText(k,X(k)+2,Y(0)+12)}}for(let k=-ny;k<=ny;k++){g.strokeStyle=k?'#1b2452':'#8d98d6';g.lineWidth=k?1:2;L(0,Y(k),W,Y(k));if(k&&k%5==0){g.fillStyle='#7f8cc4';g.fillText(k,X(0)+4,Y(k)-2)}}}
 const rf=$('#rf').value;if($('#op').value=='f'&&(rf=='d'||rf=='n')){g.strokeStyle='#3ddc97';g.setLineDash([6,5]);g.lineWidth=1.5;L(X(-40),Y(rf=='d'?-40:40),X(40),Y(rf=='d'?40:-40));g.setLineDash([])}
 g.setLineDash([6,5]);ghost.forEach(s=>{path(s.p);g.strokeStyle='#ff9a56';g.lineWidth=2;g.stroke()});g.setLineDash([]);
 sh.forEach((s,i)=>{path(s.p);g.fillStyle=s.c+'55';g.fill();g.strokeStyle=i==sel?'#fff':s.c;g.lineWidth=i==sel?3:2;g.stroke();
  if(i==sel||sel<0&&s.p.length<8){g.font='12px sans-serif';s.p.forEach((q,k)=>{g.fillStyle=s.c;g.beginPath();g.arc(X(q[0]),Y(q[1]),4,0,7);g.fill();g.fillStyle='#e8ecff';g.fillText(`${LT[k%26]} (${f2(q[0])},${f2(q[1])})`,X(q[0])+7,Y(q[1])-7)})}});
 const pv=$('#pv').value;if(pv!='o'){const p=pivot();g.fillStyle='#3ddc97';g.beginPath();g.arc(X(p[0]),Y(p[1]),6,0,7);g.fill();g.fillText('pivot',X(p[0])+8,Y(p[1])+14)}
 g.strokeStyle=$('#col').value;g.lineWidth=2;if(tmp.length){g.beginPath();tmp.concat([ms]).forEach((q,i)=>i?g.lineTo(X(q[0]),Y(q[1])):g.moveTo(X(q[0]),Y(q[1])));g.stroke()}
 if(drag&&drag.t=='rect'){g.strokeRect(X(drag.x),Y(drag.y),(ms[0]-drag.x)*S,-(ms[1]-drag.y)*S)}
 if(drag&&drag.t=='circ'){g.beginPath();g.arc(X(drag.x),Y(drag.y),Math.hypot(ms[0]-drag.x,ms[1]-drag.y)*S,0,7);g.stroke()}}
const ev=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
function hit(x,y){for(let i=sh.length-1;i>=0;i--){const p=sh[i].p;let c=false;for(let a=0,b=p.length-1;a<p.length;b=a++)if((p[a][1]>y)!=(p[b][1]>y)&&x<(p[b][0]-p[a][0])*(y-p[a][1])/(p[b][1]-p[a][1])+p[a][0])c=!c;if(c||p.some(q=>Math.hypot(q[0]-x,q[1]-y)*S<9))return i}return-1}
function fin(){if(tmp.length>=3){snap();sh.push({p:tmp,c:$('#col').value});sel=sh.length-1}tmp=[];all()}
cv.onpointerdown=e=>{const[mx,my]=ev(e);cv.setPointerCapture(e.pointerId);
 if(mode==3){drag={t:'orb',x:mx,y:my};return}
 const x=sn(wx(mx)),y=sn(wy(my));
 if(e.shiftKey){$('#pv').value='p';$('#pxv').value=x;$('#pyv').value=y;prev();d2();return}
 if(tool=='sel'){sel=hit(wx(mx),wy(my));if(sel>=0){snap();drag={t:'mv',x,y,o:JSON.parse(JSON.stringify(sh[sel].p))}}all()}
 else if(tool=='poly'){tmp.push([x,y]);d2()}else drag={t:tool,x,y}};
cv.onpointermove=e=>{const[mx,my]=ev(e);
 if(mode==3){if(drag){yaw+=(mx-drag.x)*.01;pit=Math.max(-1.5,Math.min(1.5,pit+(my-drag.y)*.01));drag.x=mx;drag.y=my;d3()}return}
 ms=[sn(wx(mx)),sn(wy(my))];$('#st').textContent=`x: ${f2(wx(mx))}  y: ${f2(wy(my))}`;
 if(drag&&drag.t=='mv'){const dx=ms[0]-drag.x,dy=ms[1]-drag.y;sh[sel].p=drag.o.map(q=>[q[0]+dx,q[1]+dy])}d2();if(drag)tbl()};
cv.onpointerup=e=>{if(mode==3){drag=null;return}
 if(drag){const c=$('#col').value;if(drag.t=='rect'&&(ms[0]!=drag.x&&ms[1]!=drag.y)){snap();sh.push({p:[[drag.x,drag.y],[ms[0],drag.y],[ms[0],ms[1]],[drag.x,ms[1]]],c});sel=sh.length-1}
 if(drag.t=='circ'){const r=Math.hypot(ms[0]-drag.x,ms[1]-drag.y);if(r>0){snap();sh.push({p:[...Array(40)].map((_,i)=>[drag.x+r*Math.cos(i*Math.PI/20),drag.y+r*Math.sin(i*Math.PI/20)].map(rd)),c});sel=sh.length-1}}
 if(drag.t=='mv'&&JSON.stringify(sh[sel].p)==JSON.stringify(drag.o))H.pop()}
 drag=null;all()};
cv.ondblclick=()=>{if(tool=='poly'){tmp.pop();fin()}};
cv.onwheel=e=>{e.preventDefault();const k=e.deltaY<0?1.1:.9;if(mode==3)S3*=k;else S=Math.max(6,Math.min(100,S*k));all()};
addEventListener('keydown',e=>{if(e.target.tagName=='INPUT')return;if(e.key=='Enter')fin();if(e.key=='Escape'){tmp=[];all()}if(e.key=='Delete')$('#del').click();if(e.ctrlKey&&e.key=='z')$('#un').click()});
$('#del').onclick=()=>{if(sel>=0){snap();sh.splice(sel,1);sel=-1;all()}};$('#clr').onclick=()=>{snap();sh=[];sel=-1;ghost=[];all()};
$$('#tools button').forEach(b=>b.onclick=()=>{tool=b.dataset.t;tmp=[];$$('#tools button').forEach(x=>x.classList.toggle('on',x==b))});
$('#col').oninput=()=>{if(sel>=0){sh[sel].c=$('#col').value;d2()}};['grid','snap'].forEach(i=>$('#'+i).onchange=d2);
$('#pre2').onchange=e=>{const m=[...e.target.value.matchAll(/\((-?\d+),(-?\d+)\)/g)].map(a=>[+a[1],+a[2]]);if(m.length){snap();sh.push({p:m,c:$('#col').value});sel=sh.length-1;all()}e.target.value=''};
/* ---- 3D ---- */
const OB={cube:{v:[[0,0,0],[2,0,0],[2,2,0],[0,2,0],[0,0,2],[2,0,2],[2,2,2],[0,2,2]],e:[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]]},
pyr:{v:[[0,0,0],[2,0,0],[2,0,2],[0,0,2],[1,2,1]],e:[[0,1],[1,2],[2,3],[3,0],[0,4],[1,4],[2,4],[3,4]]},
tet:{v:[[0,3,1],[3,3,2],[3,0,0],[0,0,0]],e:[[0,1],[1,2],[2,0],[0,3],[1,3],[2,3]]},
prism:{v:[[0,0,0],[3,0,0],[0,3,0],[0,0,2],[3,0,2],[0,3,2]],e:[[0,1],[1,2],[2,0],[3,4],[4,5],[5,3],[0,3],[1,4],[2,5]]}};
const load3=k=>{o3=JSON.parse(JSON.stringify(OB[k]));g3=null};
$('#pre3').onchange=e=>{snap();load3(e.target.value);all()};$('#per').onchange=d3;
function pj(p){const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pit),sp=Math.sin(pit),x=p[0]*cy+p[2]*sy,z1=-p[0]*sy+p[2]*cy,y=p[1]*cp-z1*sp,z=p[1]*sp+z1*cp,k=$('#per').checked?16/(16-z):1;return[W/2+x*S3*k,HT/2-y*S3*k]}
function d3(){g.fillStyle='#0e1430';g.fillRect(0,0,W,HT);g.font='13px sans-serif';
 [[[6,0,0],'X','#ff6b7a'],[[0,6,0],'Y','#3ddc97'],[[0,0,6],'Z','#6ea8ff']].forEach(([p,n,c])=>{const a=pj([0,0,0]),b=pj(p),m=pj(p.map(x=>-x));g.strokeStyle=c;g.lineWidth=1.5;g.setLineDash([4,4]);L(m[0],m[1],a[0],a[1]);g.setLineDash([]);L(a[0],a[1],b[0],b[1]);g.fillStyle=c;g.fillText(n,b[0]+5,b[1]-5)});
 const dr=(v,c,d)=>{g.strokeStyle=c;g.lineWidth=2;g.setLineDash(d?[6,5]:[]);o3.e.forEach(([i,j])=>{const a=pj(v[i]),b=pj(v[j]);L(a[0],a[1],b[0],b[1])});g.setLineDash([])};
 if(g3)dr(g3,'#ff9a56',1);dr(o3.v,'#6ea8ff');
